<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RGM · Studio Agro · Histórico</title><style>
  /* Fundo sempre claro — sem alternância automática por tema do sistema. */
  :root {
    --bg: #fdfcfa;
    --card: #f6f1e9;
    --card-hi: #efe6d6;
    --border: #ddd0ba;
    --text: #2a2420;
    --text-dim: #6b5f52;
    --text-muted: #8c8072;
    --accent: #927245;
    --accent-dark: #6e5636;
    --accent-ink: #fdfcfa;
    --prev: #a39b8e;
    --prev-fill: #e4dcce;
    --green: #16a34a;
    --orange: #c2540a;
    --red: #dc2626;
    --blue: #0284c7;
    --shadow: 0 8px 24px rgba(60,50,30,0.10);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
    line-height: 1.5;
  }
  .serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px 96px; }

  /* ===== Nav ===== */
  nav.topnav {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .topnav-inner {
    max-width: 1180px; margin: 0 auto; padding: 0 28px;
    display: flex; align-items: center; gap: 22px; height: 52px;
    overflow-x: auto;
  }
  .topnav-inner a {
    color: var(--text-dim); text-decoration: none; font-size: 13.5px;
    white-space: nowrap; padding: 6px 0; border-bottom: 2px solid transparent;
  }
  .topnav-inner a:hover { color: var(--text); }
  .nav-logo { height: 24px; width: auto; display: block; margin-right: 4px; }

  /* ===== Hero ===== */
  header.hero { padding: 56px 0 40px; border-bottom: 1px solid var(--border); }
  .hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
  .hero-logo { height: 56px; width: auto; display: block; flex-shrink: 0; }
  .eyebrow {
    color: var(--accent); font-size: 12.5px; font-weight: 700;
    letter-spacing: 0.09em; text-transform: uppercase; margin: 0 0 12px;
  }
  h1.title {
    font-size: 40px; margin: 0 0 10px; font-weight: 600; text-wrap: balance;
    letter-spacing: -0.01em;
  }
  .hero p.sub { color: var(--text-dim); font-size: 16px; margin: 0; max-width: 64ch; }
  .hero-meta { display: flex; gap: 28px; margin-top: 24px; flex-wrap: wrap; }
  .hero-meta div { font-size: 12.5px; color: var(--text-muted); }
  .hero-meta strong { display: block; color: var(--text); font-size: 14px; font-weight: 600; margin-top: 2px; }

  /* ===== Sections ===== */
  section { padding: 52px 0; border-bottom: 1px solid var(--border); }
  section:last-of-type { border-bottom: none; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 6px; flex-wrap: wrap; }
  h2.section-title { font-size: 24px; margin: 0; font-weight: 600; }
  .section-note { color: var(--text-muted); font-size: 13px; margin: 0 0 28px; max-width: 74ch; }

  /* ===== Stat tiles ===== */
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .stat {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 20px;
  }
  .stat .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat .value { font-size: 30px; font-weight: 700; margin-top: 6px; color: var(--text); letter-spacing: -0.01em; }
  .stat .foot { font-size: 12.5px; color: var(--text-dim); margin-top: 4px; }
  .stat .foot.accent { color: var(--accent); }

  /* ===== highlight banner ===== */
  .highlight {
    display: flex; gap: 18px; align-items: center;
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, var(--card)), var(--card));
    border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--border));
    border-radius: 12px; padding: 22px 26px; margin: 22px 0 0;
  }
  .highlight .num { font-size: 34px; font-weight: 700; color: var(--accent); white-space: nowrap; letter-spacing: -0.01em; }
  .highlight .txt { font-size: 14px; color: var(--text-dim); }
  .highlight .txt b { color: var(--text); }

  /* ===== Charts: monthly bars ===== */
  .chart-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px 24px 16px; margin-top: 18px;
  }
  .chart-card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .chart-card .chart-sub { font-size: 12.5px; color: var(--text-muted); margin: 0 0 22px; }

  .kpi-primary-card { margin: 18px 0 24px; }
  .kpi-primary-card h3 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
  .kpi-box { background: var(--card-hi); border: 1px solid var(--accent); border-radius: 10px; padding: 18px 8px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 16px; }
  .kpi-box .kpi-item { text-align: center; padding: 0 6px; }
  .kpi-box .kpi-item .kl { font-size: 11.5px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .kpi-box .kpi-item .kv { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi-box .kpi-item .kv.red { color: var(--red); }
  .kpi-box .kpi-item .kv.green { color: var(--green); }
  .kpi-box .kpi-item .kmeta { margin-top: 6px; background: var(--card); border: 1px solid var(--border); border-radius: 5px; padding: 4px 6px; font-size: 11px; color: var(--text-dim); }
  .kpi-row { display: grid; gap: 8px; margin-bottom: 14px; }
  .kpi-row.secondary { grid-template-columns: repeat(4, 1fr); row-gap: 18px; }
  .kpi-row .kpi-item { text-align: center; }
  .kpi-row .kpi-item .kl { font-size: 11.5px; color: var(--text-dim); margin-bottom: 5px; }
  .kpi-row .kpi-item .kv { font-size: 16.5px; font-weight: 700; color: var(--red); font-variant-numeric: tabular-nums; }
  .kpi-footnote { font-size: 11px; font-style: italic; color: var(--text-muted); margin-top: 4px; line-height: 1.5; }
  @media (max-width: 720px) {
    .kpi-box { grid-template-columns: repeat(3, 1fr); row-gap: 16px; }
    .kpi-row.secondary { grid-template-columns: repeat(2, 1fr); row-gap: 16px; }
  }
  .bars {
    display: flex; align-items: flex-end; gap: 10px;
  }
  .bars.horizontal-set { flex-direction: column; align-items: stretch; gap: 14px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; min-width: 0; }
  .bar-col .bar-val { font-size: 11.5px; color: var(--text-dim); margin-bottom: 6px; white-space: nowrap; }
  .bar-col.current .bar-val { color: var(--accent); font-weight: 700; }
  .bar-track {
    height: 180px; width: 100%; display: flex; align-items: flex-end; justify-content: center;
    border-bottom: 1px solid var(--border);
  }
  .bar-col .bar {
    width: 100%; max-width: 46px; border-radius: 4px 4px 0 0;
    background: var(--prev-fill);
    position: relative;
    transition: filter .15s;
  }
  .bar-col.current .bar { background: var(--accent); }
  .bar-col.forecast .bar {
    background: repeating-linear-gradient(135deg, var(--card-hi), var(--card-hi) 5px, var(--border) 5px, var(--border) 9px);
    border: 1px dashed var(--text-muted);
  }
  .bar-col:hover .bar { filter: brightness(1.12); }
  .bar-month-label { margin-top: 8px; font-size: 11.5px; color: var(--text-muted); text-align: center; }

  /* ===== Multi-metric monthly grid (contratos + valor + caixa, shared month axis) ===== */
  .multi-bars-row { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 20px; }
  .multi-bars-title { width: 84px; flex-shrink: 0; font-size: 12px; color: var(--text-muted); font-weight: 600; padding-bottom: 10px; }
  .multi-bars-grid {
    flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); align-items: end;
    column-gap: 10px; height: 96px; border-bottom: 1px solid var(--border);
  }
  .mb-cell { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .mb-cell.resumo { border-left: 1px solid var(--border); padding-left: 12px; }
  .mb-val { font-size: 11px; color: var(--text-dim); margin-bottom: 5px; white-space: nowrap; }
  .mb-cell.current .mb-val { color: var(--accent); font-weight: 700; }
  .mb-bar { width: 100%; max-width: 38px; border-radius: 4px 4px 0 0; background: var(--prev-fill); }
  .mb-cell.current .mb-bar { background: var(--accent); }
  .mb-cell.forecast .mb-bar {
    background: repeating-linear-gradient(135deg, var(--card-hi), var(--card-hi) 5px, var(--border) 5px, var(--border) 9px);
    border: 1px dashed var(--text-muted);
  }
  .multi-bars-labels { display: flex; gap: 14px; }
  .multi-bars-labels .mbl-spacer { width: 84px; flex-shrink: 0; }
  .multi-bars-labels .mbl-grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); column-gap: 10px; }
  .multi-bars-labels .mbl-grid span { text-align: center; font-size: 11.5px; color: var(--text-muted); }
  .multi-bars-labels .mbl-grid span.mbl-total { font-weight: 700; color: var(--text-dim); border-left: 1px solid var(--border); padding-left: 12px; }

  /* resumo (last column: média Jan–Jun vs Julho) */
  .mb-resumo { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 3px; padding-bottom: 2px; }
  .mb-resumo-line { font-size: 10.5px; color: var(--text-muted); white-space: nowrap; line-height: 1.3; }
  .mb-resumo-line .lbl { color: var(--text-muted); }
  .mb-resumo-line .val { color: var(--text-dim); font-weight: 700; margin-left: 3px; }
  .mb-resumo-line.jul .val { color: var(--accent); }

  /* % caixa/venda bridge row */
  .mb-pct-row { display: flex; align-items: center; gap: 14px; margin: -8px 0 20px; }
  .mb-pct-title { width: 84px; flex-shrink: 0; font-size: 10.5px; color: var(--text-muted); line-height: 1.3; }
  .mb-pct-grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); column-gap: 10px; }
  .mb-pct-cell { text-align: center; font-size: 11px; color: var(--text-dim); font-weight: 600; }
  .mb-pct-cell.current { color: var(--accent); }
  .mb-pct-cell.resumo { border-left: 1px solid var(--border); padding-left: 12px; }

  .legend-row { display: flex; gap: 18px; margin-top: 16px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; }

  /* horizontal bar row (modelo / parcelas) */
  .hbar-row { display: grid; grid-template-columns: 140px 1fr minmax(90px, 190px); align-items: center; gap: 14px; }
  .hbar-row .hbar-label { font-size: 13px; color: var(--text-dim); }
  .hbar-track { height: 14px; background: var(--card-hi); border-radius: 7px; overflow: hidden; }
  .hbar-fill { height: 100%; background: var(--accent); border-radius: 7px; }
  .hbar-row .hbar-val { font-size: 12.5px; color: var(--text-muted); text-align: right; white-space: normal; line-height: 1.3; }

  /* modelo groups: venda + caixa por modelo */
  .modelo-group { margin-bottom: 18px; }
  .modelo-group:last-child { margin-bottom: 0; }
  .modelo-group-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .modelo-group-head .modelo-name { font-size: 14px; font-weight: 700; color: var(--text); }
  .modelo-group-head .modelo-count { font-size: 12px; color: var(--text-muted); }
  .hbar-row.sub { grid-template-columns: 60px 1fr 90px; gap: 10px; margin-top: 5px; }
  .hbar-row.sub .hbar-label { font-size: 11.5px; color: var(--text-muted); }
  .hbar-row.sub .hbar-track { height: 9px; }
  .hbar-row.sub .hbar-fill.caixa { background: var(--accent-dark); }

  /* ===== Gestão comparison ===== */
  .compare-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0; align-items: stretch; margin-top: 20px; }
  .compare-col {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px;
  }
  .compare-col.current { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); box-shadow: var(--shadow); }
  .compare-col .cohort-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); font-weight: 700; }
  .compare-col.current .cohort-label { color: var(--accent); }
  .compare-col .cohort-range { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; margin-bottom: 18px; }
  .compare-metric { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--border); gap: 10px; }
  .compare-metric:first-of-type { border-top: none; }
  .compare-metric .m-label { font-size: 13px; color: var(--text-dim); }
  .compare-metric .m-value { font-size: 18px; font-weight: 700; text-align: right; }
  .compare-vs {
    display: flex; align-items: center; justify-content: center; padding: 0 18px;
    color: var(--text-muted); font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
  }
  .delta { font-size: 11.5px; margin-left: 8px; padding: 1px 7px; border-radius: 20px; font-weight: 700; display: inline-block; }
  .delta.up { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
  .delta.down { background: color-mix(in srgb, var(--red) 18%, transparent); color: var(--red); }
  .delta.neutral { background: var(--card-hi); color: var(--text-muted); }
  .caveat {
    margin-top: 16px; font-size: 12.5px; color: var(--text-muted); display: flex; gap: 8px;
    background: var(--card-hi); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
  }
  .caveat b { color: var(--text-dim); }

  /* by-closer table */
  table.closer-table { width: 100%; border-collapse: collapse; margin-top: 22px; font-size: 13.5px; }
  table.closer-table th {
    text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-muted); font-weight: 600; padding: 0 12px 10px; border-bottom: 1px solid var(--border);
  }
  table.closer-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); color: var(--text); }
  table.closer-table tr:last-child td { border-bottom: none; }
  table.closer-table tr.subtotal td { color: var(--text-muted); font-style: italic; }
  table.closer-table td.num, table.closer-table th.num { text-align: right; }
  table.closer-table td.name { font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
  .pill.gold { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }
  .pill.neutral { background: var(--card-hi); color: var(--text-muted); }

  /* ===== Funnel ===== */
  .funnel { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(120px, 1fr); margin-top: 22px; overflow-x: auto; overflow-y: visible; padding-bottom: 4px; }
  .funnel-step { text-align: center; position: relative; padding: 0 6px; min-width: 0; }
  .funnel-val { font-weight: 700; font-size: 15px; color: var(--text); height: 22px; margin-bottom: 6px; }
  .funnel-bar-wrap { height: 110px; display: flex; align-items: flex-end; justify-content: center; }
  .funnel-bar { width: 64px; border-radius: 6px 6px 0 0; background: var(--accent-dark); }
  .funnel-step:nth-child(1) .funnel-bar { background: var(--text-muted); }
  .funnel-step:last-child .funnel-bar { background: var(--accent); }
  .funnel-step:last-child .funnel-val { color: var(--accent); }
  .funnel-label { font-size: 11.5px; color: var(--text-dim); margin-top: 10px; }
  .funnel-conv { font-size: 11px; color: var(--text-muted); margin-top: 3px; font-weight: 600; }

  footer { padding: 32px 0 0; color: var(--text-muted); font-size: 12px; }

  /* ===== Presentation-flow numbering ===== */
  .nav-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%; margin-right: 6px;
    background: var(--card-hi); color: var(--text-muted); font-size: 10px; font-weight: 700;
  }
  .topnav-inner a[href="#historico"].active .nav-num,
  .topnav-inner a:hover .nav-num { background: var(--accent); color: var(--accent-ink); }
  .hero-steps { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .hero-step {
    display: flex; align-items: center; font-size: 12.5px; color: var(--text-dim);
    background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px 5px 6px;
  }
  .step-eyebrow {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%; margin-right: 10px;
    background: color-mix(in srgb, var(--accent) 18%, var(--card)); color: var(--accent);
    font-weight: 700; font-size: 13px; flex-shrink: 0;
  }
  .section-title-row { display: flex; align-items: center; }

  /* ===== Team badge ===== */
  .badge-atual {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.03em;
    padding: 1px 7px; border-radius: 20px; margin-left: 8px; vertical-align: middle;
    background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent);
  }
  tr.saiu td.name { color: var(--text-muted); }

  /* ===== Brazil map (real state shapes) ===== */
  .brmap-wrap { margin: 6px auto 10px; max-width: 480px; }
  .brmap-svg { width: 100%; height: auto; display: block; }
  .br-state {
    stroke: var(--bg); stroke-width: 500; fill: var(--card-hi);
    cursor: pointer; transition: filter .12s;
  }
  .br-state:hover { filter: brightness(1.18); stroke: var(--accent); stroke-width: 900; }
  .brmap-tooltip {
    position: fixed; display: none; pointer-events: none; z-index: 60;
    background: var(--card-hi); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 13px; font-size: 12.5px; color: var(--text); box-shadow: var(--shadow);
    max-width: 220px;
  }
  .brmap-tooltip .tt-title { font-weight: 700; font-size: 13px; margin-bottom: 4px; color: var(--accent); }
  .brmap-tooltip .tt-row { display: flex; justify-content: space-between; gap: 12px; color: var(--text-dim); }
  .brmap-legend { display: flex; align-items: center; gap: 8px; justify-content: center; font-size: 11.5px; color: var(--text-muted); }
  .brmap-legend .brmap-scale { display: flex; gap: 3px; }
  .brmap-legend .brmap-scale span { width: 14px; height: 10px; border-radius: 3px; }

  /* ===== Nossa equipe (organograma) ===== */
  .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 22px 24px; }
  .team-card { display: flex; gap: 14px; align-items: flex-start; }
  .team-photo { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; flex-shrink: 0; background: var(--card-hi); border: 1px solid var(--border); }
  .team-avatar {
    width: 60px; height: 60px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--accent) 22%, var(--card-hi)); color: var(--accent);
    font-weight: 700; font-size: 19px; border: 1px solid var(--border);
  }
  .team-info .name { font-weight: 700; font-size: 15px; color: var(--text); }
  .team-info .role-badge {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.03em;
    padding: 1px 7px; border-radius: 20px; margin-left: 7px; vertical-align: middle;
    background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent);
  }
  .team-info .meta { font-size: 12px; color: var(--text-dim); line-height: 1.7; margin-top: 3px; }
  .team-info .meta b { color: var(--text-muted); font-weight: 600; }

  @media (max-width: 720px) {
    .compare-grid { grid-template-columns: 1fr; }
    .compare-vs { padding: 10px 0; }
    h1.title { font-size: 30px; }
    .hbar-row { grid-template-columns: 100px 1fr minmax(70px, 120px); }
    .brmap-wrap { max-width: 320px; }
  }

  :root {
    --bg: #fbfdfb; --card: #f1f6f2; --card-hi: #e3eee6; --border: #cfdfd3;
    --text: #1d2a21; --text-dim: #4d6054; --text-muted: #74887a;
    --accent: #0b8a3e; --accent-dark: #075f2a; --accent-ink: #fbfdfb;
    --prev: #9aa89e; --prev-fill: #d5e2d9;
    --shadow: 0 8px 24px rgba(20,60,30,0.10);
  }

  .hub { max-width:760px; margin:0 auto; padding:80px 28px; }
  .hub h1 { font-size:34px; font-weight:600; margin:0 0 8px; }
  .hub .sub { color:var(--text-dim); margin:0 0 40px; }
  .rgm-list { display:flex; flex-direction:column; gap:14px; }
